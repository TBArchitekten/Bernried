name: One-time Bernried asset migration

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/migrate-assets.yml"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger fixed migration endpoint
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error -X POST \
            https://mmrteayudgywutghpdev.supabase.co/functions/v1/bernried-migrate-once)
          echo "$response"
